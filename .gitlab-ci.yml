image: node:20

stages:
  - validate
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate-storybook:
  stage: validate
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run build-storybook
  artifacts:
    expose_as: Storybook static build
    when: always
    paths:
      - storybook-static/
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - job: validate-storybook
      artifacts: true
  script:
    - rm -rf public
    - cp -r storybook-static public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  environment:
    name: storybook/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/design-system-agent"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
