image: node:20

stages:
  - validate
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

validate-storybook:
  stage: validate
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run build-storybook

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm run build-storybook
    - rm -rf public
    - cp -r storybook-static public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "feature/design-system-agent"'
